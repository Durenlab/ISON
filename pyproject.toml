[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ison"
version = "0.1.0"
description = "ISON: spatial multi-omics NMF method"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "anndata>=0.10.9",
    "scanpy>=1.10.3",
    "numpy>=1.26.3",
    "pandas>=2.3.0",
    "scipy>=1.13.1",
    "scikit-learn>=1.6.1",
    "torch>=2.7.1",
    "numba>=0.60.0",
    "leidenalg>=0.10.2",
    "umap-learn>=0.5.7",
    "igraph>=0.11.8",
    "matplotlib>=3.9.4",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "magic-impute",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["ison*"]
